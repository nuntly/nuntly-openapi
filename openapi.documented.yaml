components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key (format ntly_...)
      description: Use an API key from https://nuntly.com/api-keys. Required on every endpoint.
  parameters:
    CursorParam:
      name: cursor
      in: query
      description: Pagination cursor from a previous response
      schema:
        type: string
    LimitParam:
      name: limit
      in: query
      description: The maximum number of results to return, from 1 to 30. Defaults to 30.
      schema:
        type: integer
        minimum: 1
        maximum: 30
        default: 30
  schemas:
    AgentMemory:
      type: object
      required:
        - id
        - createdAt
        - updatedAt
        - agentId
        - inboxId
        - threadId
        - memory
        - summary
      properties:
        id:
          description: The agent memory record id.
          type:
            - string
            - "null"
        createdAt:
          description: Date at which the object was created (ISO 8601 format)
          type:
            - string
            - "null"
          examples:
            - "2026-03-29T12:00:00.000Z"
        updatedAt:
          description: Date at which the object was updated (ISO 8601 format)
          type:
            - string
            - "null"
        agentId:
          description: The agent identifier.
          type: string
        inboxId:
          description: The inbox id.
