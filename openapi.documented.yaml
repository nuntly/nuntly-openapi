openapi: 3.1.0
info:
  title: Nuntly REST API
  version: 2.0.0
  description: Nuntly REST API definition
  termsOfService: https://nuntly.com/legal/terms-of-service
  contact:
    name: Nuntly Support
    url: https://nuntly.com/docs
    email: support@nuntly.com
servers:
  - description: Nuntly API endpoint
    url: https://api.nuntly.com
externalDocs:
  description: Nuntly API Documentation
  url: https://nuntly.com/docs
security:
  - bearerAuth: []
tags:
  - name: API Keys
    description: Create and revoke API keys used to authenticate requests to the Nuntly API.
  - name: Agents
    description: Read and write persistent state for an AI agent, optionally scoped to a specific inbox or thread.
  - name: Broadcasts
  - name: Contact Properties
  - name: Contacts
  - name: Domains
    description: Add and verify sending and receiving domains. Manage DKIM records, SPF configuration, and enable inbound email routing.
  - name: Emails
    description: Send transactional emails, retrieve sending history, and track delivery status per message.
  - name: Inboxes
    description: Create email inboxes at a specific address on a verified receiving domain. Assign inboxes to namespaces or AI agents.
  - name: Messages
    description: Access received messages, download attachments, and send replies or forwards from an inbox.
  - name: Namespaces
    description: Isolate inboxes by tenant, client, or agent using namespaces. Use an external ID to map namespaces to your own data model.
  - name: Organizations
    description: Manage your organization profile, team members, and account-level settings.
  - name: Segment memberships
  - name: Segments
  - name: Templates
  - name: Threads
    description: Browse email conversations grouped by subject. Mark threads as read or spam, and assign them to an agent.
  - name: Topic memberships
  - name: Topics
  - name: Webhooks
    description: Register HTTP endpoints to receive real-time delivery events such as bounces, opens, and clicks.
  - name: Webhooks Events
    description: Inspect webhook event history and replay failed deliveries for debugging or recovery.
  - name: Webhooks Hook
    description: Endpoint your server implements to receive webhook events. Not a Nuntly API endpoint - this documents the shape your handler must accept.
paths:
  /agents/{agentId}/memory:
    get:
      summary: Retrieve Agent Memory
      description: Retrieves the key-value memory and summary saved for an AI agent, at organization level or scoped to one inbox or thread via query parameters.
      operationId: retrieve-agent-memory
      x-mint:
        href: /api-reference/agents/retrieve-agent-memory
      tags:
        - Agents
      parameters:
        - name: agentId
          in: path
          required: true
          description: The agent identifier.
          schema:
            type: string
        - name: inboxId
          in: query
          description: The id of an inbox in your organization. Scopes memory to that inbox.
          schema:
            type: string
        - name: threadId
          in: query
          description: The id of a thread in your organization. Scopes memory to that thread.
          schema:
            type: string
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AgentMemory"
                required:
                  - data
                additionalProperties: false
        "500":
          description: An error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X GET 'https://api.nuntly.com/agents/aB3dE7fG/memory' \
              -H 'Authorization: Bearer ntly_xxx'
        - lang: JavaScript
          source: |-
            import { Nuntly } from '@nuntly/sdk';

            const client = new Nuntly({
              apiKey: process.env['NUNTLY_API_KEY'],
            });

            const response = await client.agents.memory.retrieve('aB3dE7fG');
        - lang: Java
          source: |-
            import com.nuntly.sdk.Nuntly;
            import com.nuntly.sdk.ClientOptions;

            var nuntly = Nuntly.create(ClientOptions.builder()
                .apiKey(System.getenv("NUNTLY_API_KEY"))
                .build());

            var response = nuntly.agents().memory().retrieve("aB3dE7fG");
    put:
      summary: Upsert Agent Memory
      description: Saves the key-value memory and optional summary of an AI agent, at organization level or scoped to a specific inbox or thread. Returns the saved memory.
      operationId: upsert-agent-memory
      x-mint:
        href: /api-reference/agents/upsert-agent-memory
      tags:
        - Agents
      parameters:
        - name: agentId
          in: path
          required: true
          description: The agent identifier.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentMemoryRequest"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AgentMemory"
                required:
                  - data
                additionalProperties: false
        "500":
          description: An error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X PUT 'https://api.nuntly.com/agents/aB3dE7fG/memory' \
              -H 'Authorization: Bearer ntly_xxx' \
              -H 'Content-Type: application/json' \
              -d '{"memory":{"lastTopic":"billing","openTickets":2}}'
        - lang: JavaScript
          source: |-
            import { Nuntly } from '@nuntly/sdk';

            const client = new Nuntly({
              apiKey: process.env['NUNTLY_API_KEY'],
            });

            const response = await client.agents.memory.upsert('aB3dE7fG', {
              memory: { lastTopic: 'billing', openTickets: 2 },
            });
        - lang: Java
          source: |-
            import com.nuntly.sdk.Nuntly;
            import com.nuntly.sdk.ClientOptions;
            import com.nuntly.sdk.models.*;

            var nuntly = Nuntly.create(ClientOptions.builder()
                .apiKey(System.getenv("NUNTLY_API_KEY"))
                .build());

            var response = nuntly.agents().memory().upsert("aB3dE7fG", AgentMemoryRequest.builder()
                .memory(java.util.Map.of("lastTopic", "billing", "openTickets", 2))
                .build());
  /api-keys:
    post:
      summary: Create API Key
      description: Creates an API key with full access or send-only access, optionally limited to chosen domains. The secret key value is returned only in this response.
      operationId: create-api-key
      x-mint:
        href: /api-reference/api-keys/create-api-key
      tags:
        - API Keys
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CreateApiKeyResponse"
                required:
                  - data
                additionalProperties: false
        "500":
          description: An error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X POST 'https://api.nuntly.com/api-keys' \
              -H 'Authorization: Bearer ntly_xxx' \
              -H 'Content-Type: application/json' \
              -d '{"name":"Production"}'
        - lang: JavaScript
          source: |-
            import { Nuntly } from '@nuntly/sdk';

            const client = new Nuntly({
              apiKey: process.env['NUNTLY_API_KEY'],
            });

            const response = await client.apiKeys.create({
              name: 'Production',
            });
        - lang: Java
          source: |-
            import com.nuntly.sdk.Nuntly;
            import com.nuntly.sdk.ClientOptions;
            import com.nuntly.sdk.models.*;

            var nuntly = Nuntly.create(ClientOptions.builder()
                .apiKey(System.getenv("NUNTLY_API_KEY"))
                .build());

            var response = nuntly.apiKeys().create(CreateApiKeyRequest.builder()
                .name("Production")
                .build());
    get:
      summary: List API Keys
      description: Lists the API keys of your organization, newest first, with cursor pagination. Each key shows its name, status, creation date, and a short token hint.
      operationId: list-api-keys
      x-mint:
        href: /api-reference/api-keys/list-api-keys
      tags:
        - API Keys
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKeysResponseItem"
                  nextCursor:
                    type:
                      - string
                      - "null"
                required:
                  - data
                additionalProperties: false
        "500":
          description: An error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X GET 'https://api.nuntly.com/api-keys' \
              -H 'Authorization: Bearer ntly_xxx'
        - lang: JavaScript
          source: |-
            import { Nuntly } from '@nuntly/sdk';

            const client = new Nuntly({
              apiKey: process.env['NUNTLY_API_KEY'],
            });

            const response = await client.apiKeys.list();
        - lang: Java
          source: |-
            import com.nuntly.sdk.Nuntly;
            import com.nuntly.sdk.ClientOptions;

            var nuntly = Nuntly.create(ClientOptions.builder()
                .apiKey(System.getenv("NUNTLY_API_KEY"))
                .build());

            var response = nuntly.apiKeys().list();
  /api-keys/{id}:
    delete:
      summary: Delete API Key
      description: Permanently deletes an API key. Any request that authenticates with this key is rejected from then on. This cannot be undone.
      operationId: delete-api-key
      x-mint:
        href: /api-reference/api-keys/delete-api-key
      tags:
        - API Keys
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the api key
          schema:
            type: string
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DeleteApiKeyResponse"
                required:
                  - data
                additionalProperties: false
        "500":
          description: An error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X DELETE 'https://api.nuntly.com/api-keys/apk_01ka8k8s80gvx9604cn9am5st4' \
              -H 'Authorization: Bearer ntly_xxx'
        - lang: JavaScript
          source: |-
            import { Nuntly } from '@nuntly/sdk';

            const client = new Nuntly({
              apiKey: process.env['NUNTLY_API_KEY'],
            });

            const response = await client.apiKeys.delete('apk_01ka8k8s80gvx9604cn9am5st4');
        - lang: Java
          source: |-
            import com.nuntly.sdk.Nuntly;
            import com.nuntly.sdk.ClientOptions;

            var nuntly = Nuntly.create(ClientOptions.builder()
                .apiKey(System.getenv("NUNTLY_API_KEY"))
                .build());

            var response = nuntly.apiKeys().delete("apk_01ka8k8s80gvx9604cn9am5st4");
    get:
      summary: Retrieve API Key
      description: Retrieves an API key by id with its name, status, creation date, and a short token hint. The full secret key value is never returned after creation.
      operationId: retrieve-api-key
      x-mint:
        href: /api-reference/api-keys/retrieve-api-key
      tags:
        - API Keys
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the api key
          schema:
            type: string
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ApiKeyResponse"
                required:
                  - data
                additionalProperties: false
        "500":
          description: An error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X GET 'https://api.nuntly.com/api-keys/apk_01ka8k8s80gvx9604cn9am5st4' \
              -H 'Authorization: Bearer ntly_xxx'
        - lang: JavaScript
          source: |-
            import { Nuntly } from '@nuntly/sdk';

            const client = new Nuntly({
              apiKey: process.env['NUNTLY_API_KEY'],
            });

            const response = await client.apiKeys.retrieve('apk_01ka8k8s80gvx9604cn9am5st4');
        - lang: Java
          source: |-
            import com.nuntly.sdk.Nuntly;
            import com.nuntly.sdk.ClientOptions;

            var nuntly = Nuntly.create(ClientOptions.builder()
                .apiKey(System.getenv("NUNTLY_API_KEY"))
                .build());

            var response = nuntly.apiKeys().retrieve("apk_01ka8k8s80gvx9604cn9am5st4");
    patch:
      summary: Update API Key
      description: Updates the name of an API key, enables or disables it, or changes its access level and domain restrictions. Returns the id of the updated key.
      operationId: update-api-key
      x-mint:
        href: /api-reference/api-keys/update-api-key
      tags:
        - API Keys
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the api key
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApiKeyRequest"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UpdateApiKeyResponse"
                required:
                  - data
                additionalProperties: false
        "500":
          description: An error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X PATCH 'https://api.nuntly.com/api-keys/apk_01ka8k8s80gvx9604cn9am5st4' \
              -H 'Authorization: Bearer ntly_xxx' \
              -H 'Content-Type: application/json' \
              -d '{"name":"Production"}'
        - lang: JavaScript
          source: |-
            import { Nuntly } from '@nuntly/sdk';

            const client = new Nuntly({
              apiKey: process.env['NUNTLY_API_KEY'],
            });

            const response = await client.apiKeys.update('apk_01ka8k8s80gvx9604cn9am5st4', {
              name: 'Production',
            });
        - lang: Java
          source: |-
            import com.nuntly.sdk.Nuntly;
            import com.nuntly.sdk.ClientOptions;
            import com.nuntly.sdk.models.*;

            var nuntly = Nuntly.create(ClientOptions.builder()
                .apiKey(System.getenv("NUNTLY_API_KEY"))
                .build());

            var response = nuntly.apiKeys().update("apk_01ka8k8s80gvx9604cn9am5st4", UpdateApiKeyRequest.builder()
                .name("Production")
                .build());
  /broadcasts:
    post:
      summary: Create Broadcast
      description: Create a broadcast for your contacts.
      operationId: create-broadcast
      x-mint:
        href: /api-reference/broadcasts/create-broadcast
      tags:
        - Broadcasts
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Unique key to ensure the request is processed at most once. UUIDv4 recommended.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBroadcastRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BroadcastResponse"
                required:
                  - data
                additionalProperties: false
        "500":
          description: An error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X POST 'https://api.nuntly.com/broadcasts' \
              -H 'Authorization: Bearer ntly_xxx' \
              -H 'Content-Type: application/json' \
              -d '{"from":"Tomlinson AI <ray@info.tomlinson.ai>","name":"October newsletter"}'
        - lang: JavaScript
          source: |-
            import { Nuntly } from '@nuntly/sdk';

            const client = new Nuntly({
              apiKey: process.env['NUNTLY_API_KEY'],
            });

            const response = await client.broadcasts.create({
              from: 'Tomlinson AI <ray@info.tomlinson.ai>',
              name: 'October newsletter',
            });
        - lang: Java
          source: |-
            import com.nuntly.sdk.Nuntly;
            import com.nuntly.sdk.ClientOptions;
            import com.nuntly.sdk.models.*;

            var nuntly = Nuntly.create(ClientOptions.builder()
                .apiKey(System.getenv("NUNTLY_API_KEY"))
                .build());

            var response = nuntly.broadcasts().create(CreateBroadcastRequest.builder()
                .from("Tomlinson AI <ray@info.tomlinson.ai>")
                .name("October newsletter")
                .build());
    get:
      summary: List Broadcasts
      description: List the organization broadcasts.
      operationId: list-broadcasts
      x-mint:
        href: /api-reference/broadcasts/list-broadcasts
      tags:
        - Broadcasts
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BroadcastsResponseItem"
                  nextCursor:
                    type:
                      - string
                      - "null"
                required:
                  - data
                additionalProperties: false
        "500":
          description: An error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X GET 'https://api.nuntly.com/broadcasts' \
              -H 'Authorization: Bearer ntly_xxx'
        - lang: JavaScript
          source: |-
            import { Nuntly } from '@nuntly/sdk';

            const client = new Nuntly({
              apiKey: process.env['NUNTLY_API_KEY'],
            });

            const response = await client.broadcasts.list();
        - lang: Java
          source: |-
            import com.nuntly.sdk.Nuntly;
            import com.nuntly.sdk.ClientOptions;

            var nuntly = Nuntly.create(ClientOptions.builder()
                .apiKey(System.getenv("NUNTLY_API_KEY"))
                .build());

            var response = nuntly.broadcasts().list();
  /broadcasts/{broadcastId}:
