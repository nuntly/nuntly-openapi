              $ref: "#/components/schemas/UpdateBroadcastRequest"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/IdResponse"
                required:
                  - data
                additionalProperties: false
        "500":
          description: An error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      x-codeSamples:
        - lang: cURL
          source: |-
            curl -X PATCH 'https://api.nuntly.com/broadcasts/bc_01kabn43yqyxn2bx4ve84mczd3' \
              -H 'Authorization: Bearer ntly_xxx' \
              -H 'Content-Type: application/json' \
              -d '{"name":"October newsletter"}'
        - lang: JavaScript
          source: |-
            import { Nuntly } from '@nuntly/sdk';

            const client = new Nuntly({
