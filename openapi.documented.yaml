          description: The DNS records for your domain.
          type: array
          items:
            type: object
            required:
              - name
              - fullname
              - recordType
              - ttl
              - group
              - value
              - status
              - statusAt
            properties:
              name:
                description: The name of the record.
                type: string
              fullname:
                description: The FQDN of the domain record
                type: string
              recordType:
                description: "The type of the record: \"TXT\", \"MX\" or \"CNAME\""
                type: string
                enum:
                  - TXT
                  - MX
                  - CNAME
              ttl:
                description: TTL (Time To Live) for this DNS record specifies the duration (in seconds)
                type: string
              group:
                description: "The group of group: \"DKIM\", \"SPF\", \"MX\" or \"DMARC\". It is useful to group the records"
                type: string
                enum:
                  - DKIM
                  - SPF
                  - MX
                  - DMARC
                  - MX_RECEIVING
              selector:
                description: A unique identifier in DKIM record to create CNAME records for verifying domain ownership and enabling email authentication
                type: string
              priority:
                description: Priority in a DNS record, typically used in MX (Mail Exchange) records, specifies the order in which mail servers should be used, with lower values indicating higher priority for email delivery
                type: string
              value:
                description: The value of a DNS record is the data that the record points to
                type: string
              status:
                description: The status of the record
                $ref: '#/components/schemas/DomainStatus'
              statusAt:
                description: The date of the lastest verification of this record
                type: string
