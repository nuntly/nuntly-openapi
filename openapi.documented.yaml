            var nuntly = Nuntly.create(ClientOptions.builder()
                .apiKey(System.getenv("NUNTLY_API_KEY"))
                .build());

            var response = nuntly.broadcasts().update("bc_01kabn43yqyxn2bx4ve84mczd3", UpdateBroadcastRequest.builder()
                .name("October newsletter")
                .build());
  /broadcasts/{broadcastId}/recipients:
    get:
      summary: List Recipients
      description: List the recipients of a broadcast.
      operationId: list-broadcast-recipients
      x-mint:
        href: /api-reference/broadcasts/list-broadcast-recipients
      tags:
