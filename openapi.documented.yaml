    OrganizationUsageResponse:
      type: object
      required:
        - email
      properties:
        email:
          type: object
          required:
            - daily
            - monthly
          properties:
            daily:
              type: object
              required:
                - used
                - limit
                - breakdown
                - resetsAt
              properties:
                used:
                  description: "Emails counted against the limit in this window: the sum of breakdown."
                  type: number
                limit:
                  description: Maximum emails for this window after any per-organization adjustment. null means the window is unlimited. 0 means every transactional send is refused.
                  type:
                    - number
                    - "null"
                breakdown:
                  description: Emails counted in this window, per channel. used is the sum of all its values.
                  type: object
                  required:
                    - transactional
                    - broadcast
                  properties:
                    transactional:
                      type: object
                      required:
                        - sent
                        - received
                      properties:
                        sent:
                          description: Transactional emails sent
                          type: number
                        received:
                          description: Emails received
                          type: number
                    broadcast:
                      type: object
                      required:
                        - sent
                      properties:
                        sent:
                          description: Broadcast emails sent
                          type: number
                resetsAt:
                  description: When the daily window resets (next midnight UTC).
                  type: string
            monthly:
              type: object
              required:
                - used
                - limit
                - breakdown
                - resetsAt
              properties:
                used:
                  description: "Emails counted against the limit in this window: the sum of breakdown."
                  type: number
                limit:
                  description: Maximum emails for this window after any per-organization adjustment. null means the window is unlimited. 0 means every transactional send is refused.
                  type:
                    - number
                    - "null"
                breakdown:
                  description: Emails counted in this window, per channel. used is the sum of all its values.
                  type: object
                  required:
                    - transactional
                    - broadcast
                  properties:
                    transactional:
                      type: object
                      required:
                        - sent
                        - received
                      properties:
                        sent:
                          description: Transactional emails sent
                          type: number
                        received:
                          description: Emails received
                          type: number
                    broadcast:
                      type: object
                      required:
                        - sent
                      properties:
                        sent:
                          description: Broadcast emails sent
                          type: number
                resetsAt:
                  description: When the monthly window resets (end of the billing period). null when the subscription records no period end.
                  type:
                    - string
                    - "null"
